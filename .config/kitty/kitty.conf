# font_family CaskaydiaCove Nerd Font Mono
background_opacity          0.90
cursor_trail                1
cursor_trail_decay          0.05 0.1
cursor_trail_start_threshold 1
window_padding_width        4 10 10 10
confirm_os_window_close     0


# BEGIN_KITTY_THEME
# Gotham (Gruvbox Dark colors)
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="UbuntuMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
font_size        11
cursor_shape                beam

# Lets background_opacity change on a config reload, which is how the
# Glacier settings panel (Hyprland tab → Opacity) sets it. Without this kitty
# keeps whatever opacity it started with. Takes effect for kitty windows
# started after this line was added.
dynamic_background_opacity yes
