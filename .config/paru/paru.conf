[options]
Include = /etc/paru.conf

# dynamic-glacier-git is hand-patched under /usr/share/dynamic-glacier — an
# upgrade (regular or devel/-git rebuild) would silently overwrite those
# patches. Keep it pinned; reapply patches manually if it's ever unignored.
# (IgnorePkg itself lives in /etc/pacman.conf, which paru reads directly —
# only the devel/-git rebuild check is paru-specific and belongs here.)
IgnoreDevel = dynamic-glacier-git
