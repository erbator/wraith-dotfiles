# Session lock (Super+L and the power menu's Lock), dressed as a Linux
# console login: black screen, agetty banner, nothing echoed while typing.
# Text colours come from hyprlock-colors.conf, which apply-theme.sh
# regenerates on every theme switch.

source = ~/.config/hypr/hyprlock-colors.conf

$font = UbuntuMono Nerd Font Mono
$size = 11
# Height of one console line at $size, for the input below the prompt.
$line = 16

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(000000)
}

# The whole console as one label, so the font sets the line spacing: the
# /etc/issue banner, the login line, and the prompt with a block cursor
# blinking at the console's ~0.5s rate.
label {
    monitor =
    text = cmd[update:500] printf '%s %s (tty1)    %s\n%s login: %s\nPassword: %s' "$(grep -Po '^PRETTY_NAME="\K[^"]*' /etc/os-release)" "$(uname -r)" "$(date '+%a %b %e %H:%M:%S %Y')" "$(cat /etc/hostname)" "$(whoami)" "$([ $(( $(date +%s%N) / 500000000 % 2 )) -eq 0 ] && echo █)"
    color = $foreground
    font_size = $size
    font_family = $font
    position = 0, 0
    halign = left
    valign = top
}

# The real input, invisible: like a tty it echoes nothing. It sits on the
# line under the prompt so only its failure message ever shows there.
input-field {
    monitor =
    size = 600, $line
    outline_thickness = 0
    rounding = 0
    hide_input = true
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    font_color = $foreground
    font_family = $font
    placeholder_text =
    fail_text = Login incorrect
    fail_timeout = 3000
    dots_center = false
    fade_on_empty = false
    position = 0, -48
    halign = left
    valign = top
}
